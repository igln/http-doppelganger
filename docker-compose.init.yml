version: '3.8'

services:
  nginx-init:
    image: nginx:alpine
    container_name: nginx-init
    ports:
      - "80:80"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - ./nginx-init.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network

  certbot-init:
    image: certbot/certbot:latest
    container_name: certbot-init
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Waiting for nginx to start...'
        sleep 5
        certbot certonly --webroot --webroot-path=/var/www/certbot \
          --email ${EMAIL} \
          --agree-tos \
          --no-eff-email \
          -d ${DOMAIN} \
          --non-interactive \
          --force-renewal
      "
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    depends_on:
      - nginx-init
    networks:
      - proxy-network

volumes:
  letsencrypt:
  certbot-www:

networks:
  proxy-network:
    driver: bridge
