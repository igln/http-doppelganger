version: '3.8'

services:
  gitlab-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitlab-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "22:22"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      - TZ=UTC
    depends_on:
      certbot:
        condition: service_completed_successfully
    networks:
      - proxy-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "
        if [ ! -f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem ]; then
          echo 'Obtaining initial certificate...'
          certbot certonly --webroot --webroot-path=/var/www/certbot \
            --email ${EMAIL} \
            --agree-tos \
            --no-eff-email \
            -d ${DOMAIN} \
            --non-interactive || echo 'Certificate request failed, will retry'
        else
          echo 'Certificate exists, attempting renewal...'
          certbot renew --quiet
        fi
      "
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    networks:
      - proxy-network

  certbot-renew:
    image: certbot/certbot:latest
    container_name: certbot-renew
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    depends_on:
      - gitlab-proxy
    networks:
      - proxy-network

volumes:
  letsencrypt:
  certbot-www:

networks:
  proxy-network:
    driver: bridge
